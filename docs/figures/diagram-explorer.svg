<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="IBM Plex Mono, monospace">
  <rect width="960" height="640" fill="#1C1C2E"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="22" font-weight="bold" font-family="IBM Plex Sans, sans-serif">SPOTAPOD Explorer</text>
  <text x="40" y="68" fill="#6B9EFF" font-size="12">single offline HTML file | checksum-gated | 213,491 records, analyzed locally</text>

  <!-- browser frame -->
  <rect x="40" y="88" width="880" height="470" fill="#FFFFFF"/>

  <!-- posture strip -->
  <rect x="40" y="88" width="880" height="26" fill="#1C1C2E"/>
  <text x="52" y="105" fill="#FFFFFF" font-size="9">OBSERVATIONS, NOT VERDICTS</text>
  <text x="700" y="105" fill="#6B9EFF" font-size="9">INCONCLUSIVE, never a certification</text>

  <!-- status bar -->
  <rect x="40" y="114" width="880" height="26" fill="#FFFFFF"/>
  <line x1="40" y1="140" x2="920" y2="140" stroke="#D8DCE6"/>
  <text x="52" y="131" fill="#6B7280" font-size="9">records</text>
  <text x="96" y="131" fill="#1C1C2E" font-size="9" font-weight="bold">213,491</text>
  <text x="150" y="131" fill="#6B7280" font-size="9">in view</text>
  <text x="190" y="131" fill="#1C1C2E" font-size="9" font-weight="bold">2,514</text>
  <rect x="238" y="120" width="62" height="15" fill="#1B4FD8"/>
  <text x="245" y="131" fill="#FFFFFF" font-size="9" font-weight="bold">MATCH v1</text>
  <text x="316" y="131" fill="#6B7280" font-size="9">population label</text>
  <rect x="404" y="120" width="52" height="15" fill="#E8EEFF"/>
  <text x="412" y="131" fill="#0F2F8A" font-size="9" font-weight="bold">STATED</text>

  <!-- filter bar -->
  <rect x="40" y="140" width="880" height="52" fill="#E8EEFF"/>
  <rect x="40" y="190" width="880" height="2" fill="#1B4FD8"/>
  <text x="52" y="158" fill="#6B7280" font-size="9">author identifier contains</text>
  <rect x="52" y="163" width="200" height="20" fill="#FFFFFF" stroke="#1C1C2E"/>
  <text x="60" y="177" fill="#1C1C2E" font-size="9">sebastianmelendez</text>
  <text x="280" y="158" fill="#6B7280" font-size="9">post text contains</text>
  <rect x="280" y="163" width="200" height="20" fill="#FFFFFF" stroke="#1C1C2E"/>
  
  <text x="510" y="177" fill="#0F2F8A" font-size="9" font-weight="bold">2,514 of 213,491 records in view</text>

  <!-- scatter panel -->
  <text x="56" y="216" fill="#1C1C2E" font-size="12" font-weight="bold" font-family="IBM Plex Sans, sans-serif">Likes against Views</text>
  <rect x="196" y="205" width="52" height="14" fill="#E8EEFF"/>
  <text x="202" y="215" fill="#0F2F8A" font-size="8" font-weight="bold">VERIFIED</text>
  <rect x="56" y="226" width="400" height="200" fill="#FFFFFF" stroke="#D8DCE6"/>
  <line x1="56" y1="426" x2="286" y2="226" stroke="#1C1C2E" stroke-width="1.5"/>
  <line x1="56" y1="426" x2="456" y2="290" stroke="#6B9EFF" stroke-width="1.2" stroke-dasharray="5,4"/>
  <g fill="#1B4FD8" fill-opacity="0.45">
    <rect x="120" y="392" width="3" height="3"/><rect x="150" y="380" width="3" height="3"/>
    <rect x="170" y="386" width="3" height="3"/><rect x="185" y="368" width="3" height="3"/>
    <rect x="205" y="372" width="3" height="3"/><rect x="214" y="352" width="3" height="3"/>
    <rect x="238" y="356" width="3" height="3"/><rect x="252" y="340" width="3" height="3"/>
    <rect x="262" y="352" width="3" height="3"/><rect x="286" y="330" width="3" height="3"/>
    <rect x="300" y="338" width="3" height="3"/><rect x="316" y="318" width="3" height="3"/>
    <rect x="330" y="326" width="3" height="3"/><rect x="352" y="308" width="3" height="3"/>
    <rect x="368" y="316" width="3" height="3"/><rect x="392" y="300" width="3" height="3"/>
    <rect x="235" y="368" width="3" height="3"/><rect x="270" y="344" width="3" height="3"/>
    <rect x="200" y="390" width="3" height="3"/><rect x="308" y="330" width="3" height="3"/>
  </g>
  <g fill="#0F2F8A">
    <rect x="140" y="330" width="3.4" height="3.4"/><rect x="170" y="310" width="3.4" height="3.4"/>
    <rect x="196" y="292" width="3.4" height="3.4"/><rect x="128" y="352" width="3.4" height="3.4"/>
  </g>
  <text x="62" y="242" fill="#6B7280" font-size="8">likes equal views line: the zone above it is organically impossible</text>
  <text x="270" y="420" fill="#6B7280" font-size="8">Views (log)</text>

  <!-- ratio lab mini -->
  <text x="490" y="216" fill="#1C1C2E" font-size="12" font-weight="bold" font-family="IBM Plex Sans, sans-serif">Ratio lab</text>
  <rect x="560" y="205" width="120" height="14" fill="#1C1C2E"/>
  <text x="566" y="215" fill="#6B9EFF" font-size="8" font-weight="bold">interpretation INFERENCE</text>
  <text x="490" y="240" fill="#6B7280" font-size="9">flag ratio above</text>
  <rect x="590" y="234" width="120" height="4" fill="#D8DCE6"/>
  <rect x="590" y="234" width="52" height="4" fill="#1B4FD8"/>
  <circle cx="642" cy="236" r="5" fill="#1B4FD8"/>
  <text x="720" y="240" fill="#0F2F8A" font-size="9" font-weight="bold">0.50</text>
  <g>
    <rect x="490" y="330" width="34" height="66" fill="#1B4FD8"/>
    <rect x="532" y="292" width="34" height="104" fill="#1B4FD8"/>
    <rect x="574" y="308" width="34" height="88" fill="#1B4FD8"/>
    <rect x="616" y="336" width="34" height="60" fill="#1B4FD8"/>
    <rect x="658" y="352" width="34" height="44" fill="#1B4FD8"/>
    <rect x="700" y="366" width="34" height="30" fill="#1B4FD8"/>
    <rect x="742" y="380" width="34" height="16" fill="#6B9EFF"/>
    <rect x="784" y="386" width="34" height="10" fill="#0F2F8A"/>
  </g>
  <line x1="490" y1="396" x2="828" y2="396" stroke="#1C1C2E"/>
  <text x="490" y="412" fill="#6B7280" font-size="8">thresholds are parameters, not verdicts: 3,095 flags at these settings</text>

  <!-- top authors mini -->
  <text x="56" y="452" fill="#1C1C2E" font-size="12" font-weight="bold" font-family="IBM Plex Sans, sans-serif">Top 20 authors in view</text>
  <g font-size="8" fill="#6B7280">
    <text x="56" y="472">author-one</text><rect x="130" y="464" width="200" height="9" fill="#1B4FD8"/>
    <text x="56" y="488">author-two</text><rect x="130" y="480" width="146" height="9" fill="#1B4FD8"/>
    <text x="56" y="504">author-three</text><rect x="130" y="496" width="112" height="9" fill="#1B4FD8"/>
    <text x="56" y="520">author-four</text><rect x="130" y="512" width="84" height="9" fill="#1B4FD8"/>
  </g>
  <text x="340" y="472" fill="#1C1C2E" font-size="8">2,514</text>
  <text x="340" y="504" fill="#6B7280" font-size="8">click a bar to focus filters</text>

  <!-- top posts mini -->
  <text x="490" y="452" fill="#1C1C2E" font-size="12" font-weight="bold" font-family="IBM Plex Sans, sans-serif">Top 20 posts in view</text>
  <g font-size="8" fill="#6B7280">
    <text x="490" y="472">"Agree?"</text><rect x="570" y="464" width="240" height="9" fill="#1B4FD8"/>
    <text x="490" y="488">"Hiring is..."</text><rect x="570" y="480" width="170" height="9" fill="#1B4FD8"/>
    <text x="490" y="504">"AI will..."</text><rect x="570" y="496" width="120" height="9" fill="#1B4FD8"/>
    <text x="490" y="520">"My story..."</text><rect x="570" y="512" width="88" height="9" fill="#1B4FD8"/>
  </g>
  <text x="818" y="472" fill="#1C1C2E" font-size="8">215,818 likes</text>

  <!-- flow row -->
  <text x="40" y="586" fill="#6B9EFF" font-size="11">drop file  &gt;  SHA256 checked against v1  &gt;  filter by author or keyword  &gt;  every panel recomputes  &gt;  nothing leaves your machine</text>
  <text x="40" y="614" fill="#FFFFFF" font-size="12" font-weight="bold">Barry Hurd Intelligence Lab  |  Human-Directed. AI-Enabled. Commercially Tested.</text>
</svg>
