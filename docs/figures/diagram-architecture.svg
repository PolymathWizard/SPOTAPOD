<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="IBM Plex Mono, monospace">
  <rect width="960" height="560" fill="#1C1C2E"/>
  <text x="40" y="52" fill="#FFFFFF" font-size="24" font-weight="bold" font-family="IBM Plex Sans, sans-serif">SPOTAPOD Publication Architecture</text>
  <text x="40" y="76" fill="#6B9EFF" font-size="12">the dataset is the artifact, the archive is the source, this repo is the connection</text>

  <!-- Layer 1: Dataverse -->
  <rect x="40" y="104" width="560" height="86" fill="#1B4FD8"/>
  <text x="60" y="134" fill="#FFFFFF" font-size="15" font-weight="bold">HARVARD DATAVERSE (SPOTAPOD)</text>
  <text x="60" y="156" fill="#E8EEFF" font-size="12">canonical dataset  |  DOI 10.7910/DVN/WD9AUR  |  213,491 records</text>
  <text x="60" y="174" fill="#E8EEFF" font-size="12">terms of use, version history, formal citation</text>
  <rect x="640" y="104" width="280" height="86" fill="#0F2F8A"/>
  <text x="660" y="134" fill="#FFFFFF" font-size="13" font-weight="bold">ROLE</text>
  <text x="660" y="156" fill="#E8EEFF" font-size="12">permanent research record</text>
  <text x="660" y="174" fill="#E8EEFF" font-size="12">the data lives here, only here</text>

  <path d="M 320 190 L 320 226" stroke="#6B9EFF" stroke-width="2"/>
  <path d="M 314 218 L 320 228 L 326 218" fill="none" stroke="#6B9EFF" stroke-width="2"/>
  <text x="336" y="216" fill="#6B9EFF" font-size="11">SHA256 2d64e4b2... verifies the download</text>

  <!-- Layer 2: GitHub -->
  <rect x="40" y="230" width="560" height="118" fill="#E8EEFF"/>
  <text x="60" y="260" fill="#1C1C2E" font-size="15" font-weight="bold">GITHUB (PolymathWizard/SPOTAPOD)</text>
  <text x="60" y="282" fill="#0F2F8A" font-size="12">method, data dictionary, limitations, ethics, corrections</text>
  <text x="60" y="300" fill="#0F2F8A" font-size="12">stdlib analysis scripts regenerate every headline figure</text>
  <text x="60" y="318" fill="#0F2F8A" font-size="12">gates: dash, conformance, drift, named-bug regression tests</text>
  <text x="60" y="336" fill="#0F2F8A" font-size="12">derived artifacts generated, hash-recorded, never hand edited</text>
  <rect x="640" y="230" width="280" height="118" fill="#0F2F8A"/>
  <text x="660" y="260" fill="#FFFFFF" font-size="13" font-weight="bold">ROLE</text>
  <text x="660" y="282" fill="#E8EEFF" font-size="12">the inspectability layer</text>
  <text x="660" y="300" fill="#E8EEFF" font-size="12">a skeptic can disagree without</text>
  <text x="660" y="318" fill="#E8EEFF" font-size="12">rebuilding the environment</text>

  <path d="M 320 348 L 320 384" stroke="#6B9EFF" stroke-width="2"/>
  <path d="M 314 376 L 320 386 L 326 376" fill="none" stroke="#6B9EFF" stroke-width="2"/>
  <text x="336" y="374" fill="#6B9EFF" font-size="11">disputed findings check back against source hashes</text>

  <!-- Layer 3: Evidence archive -->
  <rect x="40" y="388" width="560" height="86" fill="#1C1C2E" stroke="#6B9EFF" stroke-width="2"/>
  <text x="60" y="418" fill="#FFFFFF" font-size="15" font-weight="bold">BHIL EVIDENCE ARCHIVE</text>
  <text x="60" y="440" fill="#E8EEFF" font-size="12">original observations  |  SOURCE-NNNNNN identifiers  |  per-record SHA256</text>
  <text x="60" y="458" fill="#E8EEFF" font-size="12">controlled access, released only through the correction process</text>
  <rect x="640" y="388" width="280" height="86" fill="#0F2F8A"/>
  <text x="660" y="418" fill="#FFFFFF" font-size="13" font-weight="bold">ROLE</text>
  <text x="660" y="440" fill="#E8EEFF" font-size="12">source record and</text>
  <text x="660" y="458" fill="#E8EEFF" font-size="12">verification trail</text>

  <text x="40" y="516" fill="#6B9EFF" font-size="12">POSTURE: observations are published, verdicts are not. Absence of anomaly reports INCONCLUSIVE, never CLEAN.</text>
  <text x="40" y="540" fill="#FFFFFF" font-size="12" font-weight="bold">Barry Hurd Intelligence Lab  |  Human-Directed. AI-Enabled. Commercially Tested.</text>
</svg>
